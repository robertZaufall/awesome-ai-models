azure:
  defaults:
    cloud_type: AZURE
    max_tokens: 128000
    openai_compatibility: true
    multimodal: true
    multimodal_mime_types: ["image/jpeg", "image/png"]
    api_mode: responses
    headers:
      Content-Type: "application/json"
      api-key: "${AZURE_API_KEY}"
  models:
    - id: gpt-5.2
      reasoning_effort:
        default: none
        options: [none, low, medium, high]
    - id: gpt-5.1
      reasoning_effort:
        default: none
        options: [none, low, medium, high]
    - id: gpt-5.1-codex-mini
      reasoning_effort:
        default: low
        options: [low, medium, high]
    - id: gpt-5
      reasoning_effort:
        default: minimal
        options: [minimal, low, medium, high]
    - id: gpt-5-mini
      reasoning_effort:
        default: low
        options: [low, medium, high]
    - id: gpt-5-nano
      reasoning_effort:
        default: low
        options: [low, medium, high]
    - id: gpt-4.1
      max_tokens: 32767
    - id: gpt-4.1-mini
      max_tokens: 32767
    - id: gpt-4.1-nano
      max_tokens: 32767
    - id: gpt-4o
      max_tokens: 16383
    - id: gpt-4o-mini
      max_tokens: 16383
    - id: o4-mini
      reasoning_effort:
        default: low
        options: [low, medium, high]
      max_tokens: 100000
    - id: "anthropic/claude-haiku-4-5"
      max_tokens: 32000
      api_mode: "anthropic"
      multimodal: false
      headers:
        Content-Type: "application/json"
        x-api-key: "${AZURE_API_KEY}"
        anthropic-version: "${AZURE_API_VERSION_ANTHROPIC}"
    - id: "anthropic/claude-sonnet-4-5"
      max_tokens: 32000
      api_mode: "anthropic"
      multimodal: false
      headers:
        Content-Type: "application/json"
        x-api-key: "${AZURE_API_KEY}"
        anthropic-version: "${AZURE_API_VERSION_ANTHROPIC}"
    - id: "anthropic/claude-opus-4-5"
      max_tokens: 32000
      api_mode: "anthropic"
      multimodal: false
      headers:
        Content-Type: "application/json"
        x-api-key: "${AZURE_API_KEY}"
        anthropic-version: "${AZURE_API_VERSION_ANTHROPIC}"

